services:
  - type: web
    name: urbanpulse-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CORS_ORIGINS
        sync: false
      - key: OMP_NUM_THREADS
        value: '1'
      - key: OPENBLAS_NUM_THREADS
        value: '1'
      - key: MKL_NUM_THREADS
        value: '1'
